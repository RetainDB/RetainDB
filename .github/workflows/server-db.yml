name: Server database client

on:
  pull_request:
    paths:
      - ".github/workflows/server-db.yml"
      - "packages/server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    paths:
      - ".github/workflows/server-db.yml"
      - "packages/server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  database-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm --filter @retaindb/server... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @retaindb/server run db:generate
      - run: pnpm --filter @retaindb/server test
      - run: pnpm --filter @retaindb/server build
