name: Server database client

on:
  pull_request:
    paths:
      - ".github/workflows/server-db.yml"
      - "packages/server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"
  push:
    paths:
      - ".github/workflows/server-db.yml"
      - "packages/server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"

permissions:
  contents: read

jobs:
  database-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retaindb_test
          POSTGRES_DB: retaindb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retaindb_test -d retaindb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retaindb_test@localhost:5432/retaindb_test
      RETAINDB_TEST_DATABASE_URL: postgresql://retaindb_test@localhost:5432/retaindb_test
      RETAINDB_TEST_LOCAL_EMBEDDINGS: "true"
      EMBEDDING_MODE: local
      DISABLE_AUTO_EXTRACTION: "true"
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm --filter @retaindb/server... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @retaindb/server rebuild sharp
      - run: pnpm --filter @retaindb/server run db:generate
      - run: pnpm --filter @retaindb/server exec prisma migrate deploy
      - run: pnpm --filter @retaindb/server exec prisma migrate deploy
      - run: pnpm --filter @retaindb/server test
      - run: pnpm --filter @retaindb/server build
